<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="echoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25d366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34b7f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#echoGradient)"/>
  
  <!-- Chat bubble shape - E letter style -->
  <g fill="white">
    <!-- Left vertical line -->
    <rect x="50" y="60" width="15" height="80" rx="7"/>
    
    <!-- Top horizontal line -->
    <rect x="65" y="60" width="50" height="15" rx="7"/>
    
    <!-- Middle horizontal line -->
    <rect x="65" y="95" width="40" height="15" rx="7"/>
    
    <!-- Bottom horizontal line -->
    <rect x="65" y="125" width="50" height="15" rx="7"/>
  </g>
  
  <!-- Outer border for definition -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>
