services:
  - type: web
    name: echo-chat-app-web
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://namaste-messenger.onrender.com
      - key: VITE_SOCKET_URL
        value: https://namaste-messenger.onrender.com
      - key: VITE_API_URL_LOCAL
        value: http://localhost:5000
      - key: VITE_SOCKET_URL_LOCAL
        value: http://localhost:5000

  - type: web
    name: echo-chat-app-api
    env: node
    rootDir: server
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_TCP_SERVER
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
